# Hard-constraint parameters + citation text. Code reads numbers from here; RAG explains them.
#
# Operational LIMITS (airport capacity, wake separation, fuel, flight/ground crew, gate-change notice)
# come from the organisers' workbook challenge-2-operational-constraints.xlsx via
# config/operational_limits.yaml (scripts/import_constraints_workbook.py; read by triad.data.limits).
# Deliberate deviations: config/limits_deviations.yaml.  Values below are only the items the workbook
# does not cover.

turbulence_hard_level: SEVERE # AIM §7-1-21 Table 7-1-11 intensities
gate_buffer_min: 10           # synthetic airport ops manual (not in the workbook)

constraints:
  SHR-RWY-01:  {owner: SHARED, text: "Runway is an active arrival end at the destination (count = workbook active_runways, idents from FAA diagrams)", source: "challenge-2 workbook: airport_capacity; FAA airport diagram (config/runways.yaml)"}
  SHR-GATE-00: {owner: SHARED, text: "Gate exists on the public airport map", source: "Synthetic airport map"}
  SHR-TIME-01: {owner: SHARED, text: "Times are physically consistent (no arriving before possible; delay split adds up)", source: "Kinematics"}
  ATC-WAKE-01: {owner: ATC, text: "Gap behind leader >= workbook wake minimum for the pair (any other pair 3 NM)", source: "challenge-2 workbook: wake_separation"}
  ATC-RWY-01:  {owner: ATC, text: "Slot is free and its clock hour is below the (weather-reduced) arrival rate derived from max_runway_ops_per_hour", source: "challenge-2 workbook: airport_capacity"}
  ATC-TWY-01:  {owner: ATC, text: "Gate reachable with open taxiways", source: "NOTAM (perceived)"}
  PLT-FUEL-01: {owner: PILOT, text: "Landing fuel never below the final reserve (30 min of holding fuel); divert: fuel to alternate + final reserve", source: "challenge-2 workbook: fuel_and_crew"}
  PLT-FUEL-02: {owner: PILOT, text: "Holding within the fuel above final reserve (spare 45 min holding + contingency 5% trip)", source: "challenge-2 workbook: fuel_and_crew"}
  PLT-WX-01:   {owner: PILOT, text: "No cruise level with severe turbulence", source: "AIM §7-1-21 Table 7-1-11"}
  PLT-FDP-01:  {owner: PILOT, text: "Touchdown within 13 h of crew report time (simplified FAA Part 117)", source: "challenge-2 workbook: fuel_and_crew"}
  GND-GATE-01: {owner: GROUND, text: "Gate fits aircraft size", source: "Synthetic airport ops manual"}
  GND-GATE-02: {owner: GROUND, text: "No overlapping gate occupancy over the workbook minimum turnaround (with buffer)", source: "challenge-2 workbook: airport_capacity; synthetic gate buffer"}
  GND-GATE-03: {owner: GROUND, text: "Gate leased to the carrier or common-use", source: "Synthetic airport ops manual"}
  GND-GATE-04: {owner: GROUND, text: "Gate change notified at least 20 min before arrival", source: "challenge-2 workbook: fuel_and_crew"}
  GND-TURN-01: {owner: GROUND, text: "Arrival to next departure >= workbook minimum turnaround for the airport (or next leg delayed/swapped)", source: "challenge-2 workbook: airport_capacity"}
  GND-CREW-01: {owner: GROUND, text: "Ramp crew 8 h shift; overtime costs 1.5x base (informational, cost only - not a hard limit)", source: "challenge-2 workbook: fuel_and_crew"}
  GND-MEL-01:  {owner: GROUND, text: "Non-deferrable defect repaired before departure", source: "Boeing B737 MMEL Rev 63; FAA PL-25"}
