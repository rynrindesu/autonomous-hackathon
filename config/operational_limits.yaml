wake_separation:
  note: Simplified from FAA JO 7110.65 wake rules. Use these numbers for the ATC agent.
  class_map: {Super: J, Heavy: H, Large: M, Small: L}
  pairs:
  - {leader: Super (A380), follower: Heavy, leader_cat: J, follower_cat: H, min_separation_nm: 6, min_time_s: 180}
  - {leader: Super (A380), follower: Large, leader_cat: J, follower_cat: M, min_separation_nm: 7, min_time_s: 180}
  - {leader: Super (A380), follower: Small, leader_cat: J, follower_cat: L, min_separation_nm: 8, min_time_s: 180}
  - {leader: Heavy, follower: Heavy, leader_cat: H, follower_cat: H, min_separation_nm: 4, min_time_s: 120}
  - {leader: Heavy, follower: Large, leader_cat: H, follower_cat: M, min_separation_nm: 5, min_time_s: 120}
  - {leader: Heavy, follower: Small, leader_cat: H, follower_cat: L, min_separation_nm: 6, min_time_s: 120}
  - {leader: Large, follower: Small, leader_cat: M, follower_cat: L, min_separation_nm: 4, min_time_s: 60}
  any_other_pair: {label: Any other pair, min_separation_nm: 3, min_time_s: 60}
fuel_and_crew:
  final_reserve: {rule: Final fuel reserve, text: 30 minutes of holding fuel, applies_to: 'Pilot agent: never plan below this', holding_min: 30}
  contingency: {rule: Contingency fuel, text: 5% of trip fuel, applies_to: Pilot agent, fraction_of_trip_fuel: 0.05}
  holding_burn_narrowbody: {rule: Holding fuel burn (narrowbody), text: '2,400 kg per hour', applies_to: 'Pilot agent, A320/737 class', kg_per_hour: 2400}
  holding_burn_widebody: {rule: Holding fuel burn (widebody), text: '6,500 kg per hour', applies_to: 'Pilot agent, A330/777 class', kg_per_hour: 6500}
  spare_fuel_on_arrival: {rule: Assumed spare fuel on arrival, text: 45 minutes of holding (unless the team states otherwise), applies_to: Pilot agent, holding_min: 45}
