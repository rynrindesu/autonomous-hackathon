# Synthetic world parameters. Everything here is SYNTHETIC (labelled in UI), seeded per dataset row.
# Values are plausible defaults, not operational data. Tune freely; config hash goes into the run manifest.

seed_salt: "triad-v1"

decision:
  airborne_lead_min: 60        # AIRBORNE: decision this many minutes before expected ETA
  ground_lead_min: 45          # GROUND: decision this many minutes before the (late-adjusted) departure

aircraft_types:                # ICAO wake category (ICAO only), size class, seats, approach speed, burn rates
  B737: {wake: M, size: NARROW,   seats: 143, vapp_kt: 135, cruise_kg_min: 40, hold_kg_min: 35}
  B738: {wake: M, size: NARROW,   seats: 162, vapp_kt: 145, cruise_kg_min: 43, hold_kg_min: 38}
  B739: {wake: M, size: NARROW,   seats: 179, vapp_kt: 149, cruise_kg_min: 45, hold_kg_min: 40}
  A320: {wake: M, size: NARROW,   seats: 150, vapp_kt: 136, cruise_kg_min: 40, hold_kg_min: 36}
  A321: {wake: M, size: NARROW,   seats: 190, vapp_kt: 142, cruise_kg_min: 47, hold_kg_min: 41}
  B752: {wake: M, size: NARROW,   seats: 180, vapp_kt: 137, cruise_kg_min: 55, hold_kg_min: 48}
  B717: {wake: M, size: NARROW,   seats: 128, vapp_kt: 132, cruise_kg_min: 33, hold_kg_min: 29}
  E190: {wake: M, size: REGIONAL, seats: 100, vapp_kt: 130, cruise_kg_min: 30, hold_kg_min: 27}
  E175: {wake: M, size: REGIONAL, seats: 76,  vapp_kt: 125, cruise_kg_min: 28, hold_kg_min: 25}
  E145: {wake: M, size: REGIONAL, seats: 50,  vapp_kt: 135, cruise_kg_min: 22, hold_kg_min: 20}
  CRJ2: {wake: M, size: REGIONAL, seats: 50,  vapp_kt: 140, cruise_kg_min: 22, hold_kg_min: 20}
  CRJ9: {wake: M, size: REGIONAL, seats: 76,  vapp_kt: 140, cruise_kg_min: 27, hold_kg_min: 24}
  B763: {wake: H, size: WIDE,     seats: 211, vapp_kt: 140, cruise_kg_min: 90, hold_kg_min: 80}
  B772: {wake: H, size: WIDE,     seats: 300, vapp_kt: 145, cruise_kg_min: 115, hold_kg_min: 100}
  A332: {wake: H, size: WIDE,     seats: 278, vapp_kt: 140, cruise_kg_min: 95, hold_kg_min: 85}
  A388: {wake: J, size: WIDE,     seats: 500, vapp_kt: 140, cruise_kg_min: 200, hold_kg_min: 180}
  C208: {wake: L, size: REGIONAL, seats: 9,   vapp_kt: 90,  cruise_kg_min: 3,  hold_kg_min: 3}

airline_types:                 # seeded choice among these (2015-plausible fleets)
  WN: [B737, B738]
  AA: [B738, A321, A320]
  DL: [B739, A320, B752]
  UA: [B739, A320, B752]
  US: [A320, A321]
  B6: [A320, E190]
  AS: [B738, B739]
  NK: [A320, A321]
  F9: [A320, A321]
  VX: [A320]
  HA: [B717, A332]
  OO: [CRJ2, E175, CRJ9]
  EV: [E145, CRJ2]
  MQ: [E145, CRJ9]

long_haul:
  distance_mi: 2500
  types: {AA: B772, UA: B772, DL: B763, HA: A332, default: B763}

leader_type_mix:               # types of other traffic in the arrival sequence: [type, weight]
  - [B738, 0.40]
  - [A320, 0.25]
  - [E175, 0.15]
  - [B763, 0.12]
  - [A388, 0.03]
  - [C208, 0.05]

fuel:
  contingency_frac: 0.05
  extra_holding_min_range: [10, 40]     # AIRBORNE: discretionary fuel on board, expressed as holding minutes
  max_extra_uplift_kg_range: [800, 3000] # GROUND: extra fuel that can still be loaded
  enroute_absorb_max_frac: 0.08         # can absorb up to 8% of remaining flight time by slowing down
  enroute_absorb_burn_saving: 0.03      # slowing down burns ~3% less per minute than cruise
  speed_recovery_max_frac: 0.06         # GROUND: can recover up to 6% of block time by flying faster
  speed_recovery_burn_penalty: 0.12     # +12% burn on the sped-up portion
  alternate_speed_kt: 420
  cruise_levels: [320, 340, 360, 380]

turbulence:                   # per cruise level, seeded
  probs: {NONE: 0.45, LIGHT: 0.25, MODERATE: 0.20, SEVERE: 0.10}

atc:
  aar_normal_default: 60      # arrivals/hour (approximate, synthetic)
  aar_normal: {ATL: 120, ORD: 110, DFW: 110, DEN: 110, LAX: 72, SFO: 54, LAS: 52, IAH: 80, PHX: 64, SEA: 50, LGA: 38, JFK: 52, BOS: 60, MSP: 64, CLT: 82, DTW: 70, EWR: 42, MCO: 60}
  weather_reduction:          # [WEATHER_DELAY upper bound in minutes, fraction of AAR lost]
    - [45, 0.20]
    - [120, 0.35]
    - [100000, 0.50]
  slot_horizon_min: 120       # generate arrival slots this far past expected ETA
  taken_slot_frac: 0.30       # fraction of slots already allocated to other traffic
  closed_taxiway_prob: 0.35   # chance one taxiway is NOTAM-closed

ground:
  gates_per_carrier: 6
  common_use_gates: 3
  gate_occupancy_frac: 0.35    # fraction of gates with an occupancy window overlapping the arrival period
  gate_buffer_min: 10
  min_turnaround_min: {REGIONAL: 30, NARROW: 40, WIDE: 75}
  shift_templates:            # minutes of day
    - {shift_id: EARLY, start: 300,  end: 780}
    - {shift_id: LATE,  start: 780,  end: 1320}
    - {shift_id: NIGHT, start: 1320, end: 1740}
  hard_limit_extra_min: 120   # company/labour hard limit beyond normal shift end
  overtime_eur_per_min: 6.0   # whole turnaround team
  spare_aircraft_prob: 0.25
  defect_prob_ground_mode: 0.35
  taxiways: [A, B, C, D, E, F, K, L, M]

mct_min: {default: 40, ATL: 35, ORD: 40, DFW: 40, DEN: 35, LAX: 45, SFO: 45, LAS: 35, IAH: 40, PHX: 35, CLT: 35, MSP: 35, DTW: 40, JFK: 50, EWR: 45, LGA: 40, BOS: 40, SEA: 40, MCO: 40}

connections:
  window_min: [30, 180]       # same-airline departures from destination this long after scheduled arrival
  max_connections: 6
  pax_range: [2, 25]

alternates:
  max_distance_nm: 300
  min_carrier_flights: 20     # carrier must serve the airport >= N times in flights.csv to count as suitable
  max_candidates: 3

pilot:
  crew_duty_remaining_range: [90, 300]
