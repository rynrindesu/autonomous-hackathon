[project]
name = "triad"
version = "0.1.0"
description = "Challenge #2: ATC / Pilot / Ground subagents negotiating flight disruptions (deterministic orchestrator)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6",
  "openai>=3.42.0",
  "rank-bm25>=0.2.2",
  "pypdf>=6.21.4",
  "streamlit>=1.66.1",
  "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
triad = "triad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
